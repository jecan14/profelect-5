<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prof Elective 5</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="top-header">

        <div class="header-left">

            <div class="logo">
                PE
            </div>

            <div>

                <h1>
                    Prof Elective 5
                </h1>

                <p>
                    Advanced Web Development: Back End
                </p>

            </div>

        </div>


        <div class="submitted">

            <span>
                SUBMITTED BY
            </span>

            <strong>
                Seraon, Ruby Anne
            </strong>

            <strong>
                Cielos, Jacen Luke
            </strong>

        </div>

    </header>



    <!-- ============================= -->

    <!-- ============================= -->

    <div class="layout">


        <!-- ============================= -->
        <!-- SIDEBAR -->
        <!-- ============================= -->

        <aside class="sidebar">

            <div class="sidebar-title">

                <span>☰</span>

                WORKSHEETS

            </div>


            <div class="worksheet-list">


                <!-- 1.1 -->

                <button
                    class="worksheet-btn active"
                    data-page="worksheet1-1.html"
                    data-title="Worksheet 1.1"

                    <div class="number">
                        01
                    </div>

                    <div class="worksheet-info">

                        <strong>
                            Worksheet 1.1
                        </strong>

                        <small>
                            Landing Page
                        </small>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- 1.2 -->

                <button
                    class="worksheet-btn"
                    data-page="worksheet1-2.html"
                    data-title="Worksheet 1.2"
                >

                    <div class="number">
                        02
                    </div>

                    <div class="worksheet-info">

                        <strong>
                            Worksheet 1.2
                        </strong>

                        <small>
                            AJAX Activity
                        </small>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- 1.3 -->

                <button
                    class="worksheet-btn"
                    data-page="worksheet1-3.html"
                    data-title="Worksheet 1.3"
                >

                    <div class="number">
                        03
                    </div>

                    <div class="worksheet-info">

                        <strong>
                            Worksheet 1.3
                        </strong>

                        <small>
                            Worksheet Activity
                        </small>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- 1.4 -->

                <button
                    class="worksheet-btn"
                    data-page="worksheet1-4.html"
                    data-title="Worksheet 1.4"
                >

                    <div class="number">
                        04
                    </div>

                    <div class="worksheet-info">

                        <strong>
                            Worksheet 1.4
                        </strong>

                        <small>
                            Worksheet Activity
                        </small>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- 1.5 -->

                <button
                    class="worksheet-btn"
                    data-page="worksheet1-5.html"
                    data-title="Worksheet 1.5"
                >

                    <div class="number">
                        05
                    </div>

                    <div class="worksheet-info">

                        <strong>
                            Worksheet 1.5
                        </strong>

                        <small>
                            Worksheet Activity
                        </small>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>

            </div>



            <!-- ============================= -->
            <!-- PROGRESS -->
            <!-- ============================= -->

            <div class="progress-card">

                <div class="progress-header">

                    <span>
                        Course Progress
                    </span>

                    <strong>
                        2 / 5
                    </strong>

                </div>

                <div class="progress-bar">

                    <div class="progress-fill"></div>

                </div>

                <p>
                    Keep building your web
                    development skills.
                </p>

            </div>

        </aside>



        <!-- ============================= -->
        <!-- MAIN CONTENT -->
        <!-- ============================= -->

        <main class="main-content">

            <div class="breadcrumb">

                <span>
                    Prof Elective 5
                </span>

                <b>
                    ›
                </b>

                <strong id="currentWorksheet">
                    Worksheet 1.1
                </strong>

            </div>


            <section
                id="worksheet-content"
                class="worksheet-content"
            >

                <div class="loading">

                    <div class="spinner"></div>

                    <p>
                        Loading worksheet...
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>
